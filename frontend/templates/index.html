<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 24px;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93aee8;
            cursor: not-allowed;
        }

        #result {
            margin-top: 22px;
            padding: 15px;
            background: #f0f5ff;
            border-radius: 6px;
            display: none;
        }

        #result h2 {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        #price {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        #error {
            margin-top: 15px;
            color: #dc2626;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>House Price Predictor</h1>

        <p class="subtitle">
            Estimate the price of a house based on its area.
        </p>

        <form id="predictionForm">
            <label for="house_area">House Area (sq. ft.) (minimum 100)</label>
            <input
                type="number"
                id="house_area"
                name="house_area"
                placeholder="Enter house area"
                min="100"
                step="any"
                required
            >

            <button type="submit" id="predictButton">
                Predict Price
            </button>
        </form>


        <div id="result">
            <h2>Predicted House Price</h2>
            <p id="price"></p>
        </div>

        <p id="error"></p>
    </div>

    <script>
        const form = document.getElementById("predictionForm");
        const button = document.getElementById("predictButton");
        const result = document.getElementById("result");
        const priceElement = document.getElementById("price");
        const errorElement = document.getElementById("error");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const area = Number(
                document.getElementById("house_area").value
            );

            result.style.display = "none";
            errorElement.textContent = "";

            if (!Number.isFinite(area) || area <= 0) {
                errorElement.textContent = "Please enter a valid house area.";
                return;
            }

            button.disabled = true;
            button.textContent = "Predicting...";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        house_area: area
                    })
                });

                if (!response.ok) {
                    throw new Error("Prediction request failed (HTTP " + response.status + ")");
                }

                const data = await response.json();

                priceElement.textContent =
                    "₹" + Number(data.price).toLocaleString("en-IN", {
                        maximumFractionDigits: 2
                    });

                result.style.display = "block";

            } catch (error) {
                errorElement.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Predict Price";
            }
        });
    </script>

</body>
</html>
